<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar Web Dasar</title>
  </head>
  <body>
    <main>
      <h1>Program D3 Teknik Informatika</h1>
      <section>
        <h2>Belajar Web</h2>
        <h3>HTML Builder</h3>
        <p>Membangun struktur yang bermakna</p>
      </section>
      <section aria-labelledby="fitur-title">
        <h2 id="fitur-title">Fitur Utama</h2>
        <ul>
          <li>Latihan interaktif</li>
          <li>Pembelajaran terarah</li>
          <li>Feedback langsung</li>
        </ul>
        <a href="#daftar">Mulai Belajar</a>
        <img
          src="assets/student-learning.jpg"
          alt="Mahasiswa berlatih HTML di laptop"
        />
      </section>
      <form>
        <div>
          <label for="nama">Nama lengkap</label>
          <input id="nama" name="nama" type="text" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
        <button type="submit">Daftar</button>
      </form>
    </main>
    <h1>Hello, Web!</h1>
    <p>Ini Halaman Pertama</p>
  </body>
</html>
